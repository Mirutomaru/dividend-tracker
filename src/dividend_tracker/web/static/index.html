<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dividend Tracker</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📈%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark">📈</span>
        <h1>Dividend Tracker</h1>
      </div>
      <form id="analyze-form" autocomplete="off">
        <input
          id="ticker-input" type="text" placeholder="Např. KO JNJ MSFT O (mezerní oddělené)"
          spellcheck="false" aria-label="Tickery k analýze" />
        <button id="analyze-btn" type="submit">Analyzovat</button>
      </form>
    </div>
  </header>

  <main class="content">
    <section id="empty-state" class="empty-state">
      <div class="empty-icon">📊</div>
      <h2>Zadejte tickery a spusťte analýzu</h2>
      <p>Dividendový výnos, udržitelnost, skóre zdraví 0–100 a férová cena — vše na jednom místě.</p>
    </section>

    <section id="progress" class="hidden">
      <div class="card progress-card">
        <div class="spinner"></div>
        <div>
          <h3 id="progress-title">Analyzuji…</h3>
          <p id="progress-sub">Stahování dat z Yahoo Finance může trvat několik vteřin.</p>
        </div>
      </div>
    </section>

    <section id="results" class="results"></section>
  </main>

  <footer class="footer">
    Data: Yahoo Finance · Analýza běží lokálně · Není investiční doporučení
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
