[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dividend-tracker"
version = "0.1.0"
description = "Profesionální tracker a valuační analyzátor dividendových akcií (GUI + CLI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Miroslav Matúš", email = "mirdamatus@gmail.com" }]
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
divtrack = "dividend_tracker.cli:main"
divtrack-gui = "dividend_tracker.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# ---------------------------------------------------------------------------
# Ruff — linter + isort (CI běží `ruff check`)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes (nevyužité importy, nedefinované názvy)
    "I",     # isort (řazení importů)
    "B",     # flake8-bugbear (pravděpodobné bugy)
    "UP",    # pyupgrade — moderní anotace (X | None, list/dict/tuple), hotovo 2026-09-07
]
ignore = [
    "E501",  # délka řádku — formátování, ne linter
    "E402",  # import mimo začátek souboru — ZÁMĚRNÉ: .env se musí načíst PŘED
             # importem datových modulů (čtou DEFAULT_DB_PATH / FMP_API_KEY při importu)
    "B905",  # zip() bez strict= — style choice; sekvence jsou stejně dlouhé konstrukcí
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # assert False v testech je legitimní

# ---------------------------------------------------------------------------
# Mypy — základní typová kontrola (zatím mimo CI, viz workflow)
# ---------------------------------------------------------------------------
[tool.mypy]
mypy_path = "src"
packages = ["dividend_tracker"]
python_version = "3.10"
ignore_missing_imports = true   # yfinance nemá stuby
warn_unused_ignores = false
disallow_untyped_defs = true    # hotovo 2026-09-07 — všechny funkce mají anotace
